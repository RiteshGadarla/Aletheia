global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    deployment: aletheia

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Workers scale by replica count, so resolve every replica IP via Compose DNS.
  - job_name: aletheia-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["aletheia-worker"]
        type: A
        port: 9108
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
        replacement: aletheia-worker

  - job_name: aletheia-sealer
    static_configs:
      - targets: ["aletheia-sealer:9109"]

  - job_name: aletheia-studio
    metrics_path: /metrics
    static_configs:
      - targets: ["aletheia-studio:8081"]

  - job_name: vector
    static_configs:
      - targets: ["vector:9598"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
