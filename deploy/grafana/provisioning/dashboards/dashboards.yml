apiVersion: 1

providers:
  - name: aletheia
    orgId: 1
    folder: Aletheia
    # Fixed uid on fresh installs; Studio files alert rules in this folder, found by title.
    folderUid: aletheia
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
