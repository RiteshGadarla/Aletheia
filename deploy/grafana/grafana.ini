; Aletheia Grafana defaults. Every outbound call is disabled (spec §13.6).
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
plugin_admin_enabled = false
public_dashboards_enabled = false

[security]
disable_gravatar = true

[users]
default_theme = dark

[help]
enabled = false

[auth.anonymous]
enabled = true
org_role = Viewer

[auth.basic]
; Studio pushes alert rules with basic auth (CONTRACTS §13.1); keep it on.
enabled = true

[unified_alerting]
; Grafana evaluates the rules Studio owns. Nothing here is file-provisioned: Studio writes via API.
enabled = true
min_interval = 10s

[smtp]
; Off by default; compose/all-in-one map ALETHEIA_SMTP_* onto GF_SMTP_* (docs/alerting.md).
enabled = false
from_name = Aletheia
startTLS_policy = OpportunisticStartTLS

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/aletheia-pipeline.json

[log]
level = warn
