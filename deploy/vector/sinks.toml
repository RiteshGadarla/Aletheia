# Vector's own metrics for Prometheus. The `normalized_bus` source and the Loki sink live in
# loki.toml; the optional Splunk HEC and CEF sinks live in hec.toml and cef.toml, loaded only when
# their target is configured. ClickHouse is written by the workers directly (spec §11.1).

# ---------------------------------------------------------------- self-metrics

[sources.vector_metrics]
type = "internal_metrics"

[sinks.prometheus]
type = "prometheus_exporter"
inputs = ["vector_metrics"]
address = "${ALETHEIA_VECTOR_METRICS_ADDR:-0.0.0.0:9598}"
default_namespace = "vector"
