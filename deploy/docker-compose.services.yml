# Backing services ONLY. Engine, Studio and frontend run natively via the Makefile.
# Start with:  make services
name: aletheia-services

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      # External listener first: native clients and in-container rpk keep localhost:9092.
      # Containers (vector-loki) use the internal one, since localhost means themselves.
      - --kafka-addr external://0.0.0.0:9092,internal://0.0.0.0:29092
      - --advertise-kafka-addr external://localhost:9092,internal://redpanda:29092
    ports: ["9092:9092", "9644:9644"]
    volumes: ["redpanda:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: aletheia
      CLICKHOUSE_USER: aletheia
      CLICKHOUSE_PASSWORD: aletheia
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aletheia
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia -d aletheia"]
      interval: 5s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:3.3.2
    user: "0:0"
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["3100:3100"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/data/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      loki: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aletheia
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USAGE_STATS_ENABLED: "false"
      # Email contact points (docs/alerting.md). Off unless ALETHEIA_SMTP_ENABLED=true.
      GF_SMTP_ENABLED: ${ALETHEIA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${ALETHEIA_SMTP_HOST:-}
      GF_SMTP_USER: ${ALETHEIA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${ALETHEIA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${ALETHEIA_SMTP_FROM_ADDRESS:-aletheia@aletheia.localhost}
      ALETHEIA_CH_PASSWORD: aletheia
    # The "browser" contact point is a webhook to the natively running Studio (make studio).
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Scrapes the native worker on the host; feeds the pipeline dashboard and prometheus alert rules.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.native.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Topic `normalized` -> Loki only (no syslog listeners, no HEC/CEF), for the Grafana logs dashboard.
  vector-loki:
    image: timberio/vector:0.44.0-debian
    depends_on:
      redpanda: {condition: service_healthy}
      loki: {condition: service_healthy}
    command: ["--config", "/etc/vector/loki.toml"]
    restart: on-failure
    environment:
      ALETHEIA_BUS_BROKERS: redpanda:29092
      ALETHEIA_LOKI_ENDPOINT: http://loki:3100
      VECTOR_LOG: warn
    volumes:
      - ./vector/loki.toml:/etc/vector/loki.toml:ro
      - vector:/var/lib/vector

volumes:
  prometheus:
  vector:
  loki:
  redpanda:
  clickhouse:
  postgres:
  grafanadata:
