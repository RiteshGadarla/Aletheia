# The only HTTP port the all-in-one image serves: 6156, after SIH problem statement 26156.
# UI at /, Studio at /api/, Grafana at /grafana/. Everything else binds 127.0.0.1, so the
# container exposes one HTTP surface rather than six and `-p 6156:6156` is all a user needs.
#
# Air-gap matters in this file: the UI is a static bundle with no CDN and no webfonts, and the
# CSP below is what keeps it that way even if a future build slips in a remote reference.

user  root;
worker_processes  auto;
error_log  /data/logs/nginx-error.log warn;
pid        /data/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /data/logs/nginx-access.log;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Studio calls can be slow on purpose: a real model round-trip during onboarding takes
    # several seconds, and the default 60s proxy timeout could cut a slow answer off mid-way.
    proxy_connect_timeout  10s;
    proxy_send_timeout     120s;
    proxy_read_timeout     120s;

    upstream studio  { server 127.0.0.1:8081; }
    upstream healthz { server 127.0.0.1:8088; }
    upstream grafana { server 127.0.0.1:3000; }

    # Grafana Live is a websocket; plain requests must still send "Connection: close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      6156;
        server_name _;
        root        /usr/share/aletheia/ui;
        index       index.html;
        # Relative Location headers: a host remap (-p 8000:6156) must not redirect back to :6156.
        absolute_redirect off;

        client_max_body_size 32m;     # "bring your own log" uploads a file

        add_header X-Content-Type-Options nosniff       always;
        add_header X-Frame-Options        SAMEORIGIN    always;
        add_header Referrer-Policy        no-referrer   always;
        # 'self' only: no CDN, no webfonts, no third-party anything (spec §13.6).
        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
            always;

        location /api/ {
            proxy_pass         http://studio;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Grafana runs with serve_from_sub_path, so the /grafana/ prefix is passed through as is.
        # Its own add_header lines stop the UI's strict CSP (no inline script) being inherited,
        # which would leave Grafana a blank page.
        location = /grafana { return 301 /grafana/; }
        location /grafana/ {
            proxy_pass         http://grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            add_header X-Content-Type-Options nosniff     always;
            add_header Referrer-Policy        no-referrer always;
        }

        # Readiness comes from the aggregator, not from nginx being up: nginx answering says
        # only that nginx is answering.
        location = /healthz {
            proxy_pass       http://healthz/healthz;
            proxy_set_header Host $host;
        }

        # Hashed assets are immutable; index.html must never be cached or a redeploy strands
        # the browser on a bundle that no longer exists.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SPA routing: /lineage/<uid> is a client route, not a file.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
