# LLM Cluster Training Telemetry JSON.
pack: llm_training
version: 1
applies_to: {vendor: "AI-Cluster", product: "LLM-Trainer"}
envelopes: [bare]

templates:
  - id: llm_training_telemetry
    discriminator: '"model":'
    storage_mode: verbatim
    body:
      - {slot: json, type: custom, pattern: '\{".*"model":.*\}'}
    ocsf:
      class_uid: 4001
      activity_id: 1
      storage_mode: verbatim
      constants:
        metadata.product.vendor_name: AI-Cluster
        metadata.product.name: LLM-Trainer
      json_map:
        node: src_endpoint.hostname
        model: unmapped.model
        step: unmapped.step
        epoch: unmapped.epoch
        loss: unmapped.loss
        tflops: unmapped.tflops
        tokens_per_sec: unmapped.tokens_per_sec
        vram_used_gb: unmapped.vram_used_gb
        error: message
        warning: message
        status: [status, {path: status_id, enum: {ok: 1, grad_overflow: 2, cuda_oom: 2, throttled: 2}}]
    tests: {samples: "tests/llm_training_telemetry/*.log", expected: "tests/llm_training_telemetry/*.json"}
