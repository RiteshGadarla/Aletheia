  ocsf:
    class_uid: 4001
    activity_id: 1
    map:
      src: src_endpoint.ip
      spt: src_endpoint.port
      dst: dst_endpoint.ip
      dpt: dst_endpoint.port
      proto:
        path: connection_info.protocol_name
        transform: lowercase
      act: action_id
      cef_name: message
      cef_sigid: metadata.event_code
    unmapped_keep:
