    type: custom
    pattern: \d+
  - lit: '|'
  - slot: cef_vendor
    type: custom
    pattern: (?:[^|\\]|\\.)*
  - lit: '|'
  - slot: cef_product
    type: custom
    pattern: (?:[^|\\]|\\.)*
  - lit: '|'
  - slot: cef_devver
    type: custom
    pattern: (?:[^|\\]|\\.)*
  - lit: '|'
  - slot: cef_sigid
    type: custom
    pattern: (?:[^|\\]|\\.)*
  - lit: '|'
  - slot: cef_name
    type: custom
    pattern: (?:[^|\\]|\\.)*
  - lit: '|'
  - slot: cef_sev
    type: custom
    pattern: \d+
  - lit: '|src='
  - slot: src
    type: ip
  - lit: ' spt='
  - slot: spt
    type: port
  - lit: ' dst='
  - slot: dst
    type: ip
  - lit: ' dpt='
  - slot: dpt
    type: port
  - lit: ' proto='
  - slot: proto
    type: word
  - lit: ' act='
